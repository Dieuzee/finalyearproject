<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}BID CROP — AI Crop Disease Detection{% endblock title %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --forest: #14532d;
        --green: #16a34a;
        --green-bright: #22c55e;
        --leaf-tint: #ecfdf5;
        --leaf-tint-2: #dcfce7;
        --ink: #0f1b14;
        --slate: #51625a;
        --bg: #f4f8f6;
        --surface: #ffffff;
        --border: #e6efe9;
        --shadow-sm: 0 1px 2px rgba(10, 30, 20, 0.06);
        --shadow: 0 12px 34px rgba(10, 30, 20, 0.09);
        --shadow-lg: 0 30px 70px rgba(10, 30, 20, 0.16);
        --radius: 14px;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --display: "Sora", var(--font);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      a { text-decoration: none; color: inherit; }
      img { max-width: 100%; display: block; }

      /* ---------- Brand / logo ---------- */
      .brand { display: inline-flex; align-items: center; gap: 11px; }
      .brand-mark {
        width: 40px; height: 40px; border-radius: 11px;
        display: grid; place-items: center; flex-shrink: 0;
        background: linear-gradient(145deg, var(--green-bright), var(--forest));
        box-shadow: 0 6px 16px rgba(20, 83, 45, 0.28);
      }
      .brand-mark svg { width: 22px; height: 22px; }
      .brand-name {
        font-family: var(--font);
        font-weight: 800;
        font-size: 1.18rem;
        letter-spacing: 0.06em;
        color: var(--ink);
        line-height: 1;
      }
      .brand-name span { color: var(--green); }
      .brand-tag {
        display: block;
        font-family: var(--font);
        font-weight: 600;
        font-size: 0.62rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--slate);
        margin-top: 3px;
      }

      /* ---------- Header ---------- */
      header.app-header {
        position: sticky; top: 0; z-index: 60;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px) saturate(140%);
        border-bottom: 1px solid var(--border);
      }
      .nav-inner {
        max-width: 1160px; margin: 0 auto;
        padding: 14px 24px;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
      }
      .nav-menu { display: flex; align-items: center; gap: 30px; }
      .nav-menu a {
        font-weight: 500; font-size: 0.92rem; color: var(--slate);
        transition: color 0.2s;
      }
      .nav-menu a:hover { color: var(--green); }
      .btn-cta {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 11px 22px; border-radius: 999px; border: none;
        font-family: var(--font); font-weight: 600; font-size: 0.92rem;
        color: #fff; cursor: pointer;
        background: linear-gradient(135deg, var(--green), var(--forest));
        box-shadow: 0 10px 24px rgba(20, 83, 45, 0.22);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(20, 83, 45, 0.28); }

      main.content { max-width: 1160px; margin: 0 auto; padding: 0; }

      @media (max-width: 720px) {
        .nav-menu { display: none; }
        .nav-inner { padding: 12px 16px; }
      }
    </style>
  </head>

  <body>
    <header class="app-header" role="banner">
      <div class="nav-inner">
        <a class="brand" href="/" aria-label="BID CROP home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 21c-5-1-8-5-8-10 0-3 1-6 3-8 3 4 9 3 12 9-2 6-4 8-7 9z"
                fill="#fff" opacity="0.95"/>
              <path d="M12 21c1-5 1-9-1-13" stroke="var(--forest)" stroke-width="1.4"
                stroke-linecap="round"/>
            </svg>
          </span>
          <span>
            <span class="brand-name">BID <span>CROP</span></span>
            <span class="brand-tag">AI Crop Detector</span>
          </span>
        </a>

        <nav class="nav-menu">
          <a href="/#about">About</a>
          <a href="/#how">How it works</a>
          <a href="/#contact">Contact</a>
        </nav>

        <a href="/input" class="btn-cta">Diagnose a leaf</a>
      </div>
    </header>

    <main class="content" role="main">{% block body %}{% endblock body %}</main>
  </body>
</html>

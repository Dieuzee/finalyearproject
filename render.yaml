services:
  - type: web
    name: crop-disease-detection
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Set the actual value in the Render dashboard (Environment tab) - never commit it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

services:
  - type: web
    name: crop-disease-detection
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Diagnosis uses Ollama Cloud over HTTP. Set OLLAMA_API_KEY in the Render
      # dashboard (Environment tab) - never commit it.
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
